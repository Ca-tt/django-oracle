services:
  web:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: django_store.settings.dev
    volumes:
      - .:/app
    command:
      - sh
      - -c
      - python manage.py migrate && exec gunicorn django_store.wsgi:application --bind 0.0.0.0:8000 --workers 3 --worker-class gthread --threads 4 --reload --reload-engine poll --timeout 0

  db:
    ports:
      - "127.0.0.1:${DB_PORT}:5432"
