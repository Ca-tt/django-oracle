server {
    listen 80;
    listen [::]:80;
    server_name zamovua.shop www.zamovua.shop;

    server_tokens off;
    client_max_body_size 20m;
    client_header_timeout 15s;
    client_body_timeout 15s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /static/ {
        alias /var/www/django_store/staticfiles/;
        limit_except GET HEAD { deny all; }
    }

    location /media/ {
        alias /var/www/django_store/media/;
        limit_except GET HEAD { deny all; }
        # add_header in a location replaces server-level headers, so repeat them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; sandbox" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
