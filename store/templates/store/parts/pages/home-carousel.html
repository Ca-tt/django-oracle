<div id="template-mo-zay-hero-carousel" class="carousel slide" data-bs-ride="carousel">
  <ol class="carousel-indicators">
    {% for product in featured_products %}
      <li data-bs-target="#template-mo-zay-hero-carousel" data-bs-slide-to="{{ forloop.index }}" class="{% if forloop.first %}active{% endif %}"></li>
    {% endfor %}
  </ol>
  <div class="carousel-inner">
    {% for product in featured_products %}
      <div class="carousel-item {% if forloop.first %}active{% endif %}">
        <div class="container">
          <div class="row p-3">
            <div class="mx-auto col-md-8 col-lg-6 text-md-end order-lg-last">
              <a href="{% url 'product_single' slug=product.slug %}"><img class="img-fluid" src="{{ product.main_image.url }}" alt="{{ product.image.short_description }}" /></a>
            </div>
            <div class="col-lg-6 mb-0 d-flex align-items-center">
              <div class="text-align-left align-self-center">
                <h1 class="h1"><b>{{ product.title }}</b></h1>
                <h3 class="h2">{{ product.short_description }}</h3>
                <p>{{ product.short_description }}</p>
                <p>
                  <a href="{% url 'product_single' slug=product.slug %}" class="btn btn-light">See details</a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    {% endfor %}
  </div>
  <a class="carousel-control-prev text-decoration-none w-auto ps-3" href="#template-mo-zay-hero-carousel" role="button" data-bs-slide="prev"><i class="fas fa-chevron-left"></i></a>
  <a class="carousel-control-next text-decoration-none w-auto pe-3" href="#template-mo-zay-hero-carousel" role="button" data-bs-slide="next"><i class="fas fa-chevron-right"></i></a>
</div>
